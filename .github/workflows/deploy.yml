name: CI

on:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test Python application
        run: python -m py_compile app.py

      - name: Prepare SSH key
        run: |
          mkdir -p "$HOME/.ssh"
          echo "${{ secrets.EC2_SSH_KEY }}" > "$HOME/.ssh/ec2.pem"
          chmod 600 "$HOME/.ssh/ec2.pem"
          echo "SSH key prepared"

      - name: Test SSH connection
        run: |
          ssh -vvv \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=10 \
            -i "$HOME/.ssh/ec2.pem" \
            ubuntu@"${{ secrets.EC2_HOST }}" \
            "echo SSH connection successful"
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -i "$HOME/.ssh/ec2.pem" \
            ubuntu@"${{ secrets.EC2_HOST }}" \
            "cd ~/simple-python-app && git pull origin master && docker compose up -d --build"
