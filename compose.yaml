# Creating services for the web application
services:
  web:
    build: .
    image: simple-python-app:latest
    ports:
      - "5000:5000"  
    environment: 
     - Flask_ENV=development


  database:            # Adding database service to the application                   
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simple-app
    volumes:         # Adding a volume for presistent data storage
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mysql-data:
    